# Supervised Fine-Tuning Configuration (Full or PEFT)
method: sft
type: sft

# PEFT settings (set enabled: false for full fine-tuning)
lora:
  enabled: true
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    - q_proj
    - v_proj
  bias: none
  task_type: CAUSAL_LM

# Training hyperparameters
training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: linear
  max_seq_length: 2048

# Optimizer
optimizer:
  name: adamw_torch
  betas: [0.9, 0.999]
  eps: 1e-8

# Logging and saving
logging:
  log_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3

# Early stopping
early_stopping:
  enabled: true
  patience: 3
  threshold: 0.001
