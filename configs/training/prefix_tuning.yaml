# Prefix Tuning Configuration
method: prefix_tuning
type: sft

# Prefix tuning parameters
prefix:
  num_virtual_tokens: 20
  encoder_hidden_size: 128
  prefix_projection: true

# Training hyperparameters
training:
  num_epochs: 5
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 2048

# Optimizer
optimizer:
  name: adamw_torch
  betas: [0.9, 0.999]
  eps: 1e-8

# Logging and saving
logging:
  log_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3

# Early stopping
early_stopping:
  enabled: true
  patience: 3
  threshold: 0.001
