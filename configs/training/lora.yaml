# LoRA Training Configuration
method: lora
type: sft  # sft, dpo

# LoRA hyperparameters
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

# Training hyperparameters
training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_seq_length: 2048

# Optimizer
optimizer:
  name: adamw_torch
  betas: [0.9, 0.999]
  eps: 1e-8

# Logging and saving
logging:
  log_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3

# Early stopping
early_stopping:
  enabled: true
  patience: 3
  threshold: 0.001
