# HuggingFace Inference API Configuration
name: hf_inference
family: mistral

# Model source
source: api
api_provider: huggingface
model_id: mistralai/Mistral-7B-Instruct-v0.2

# API settings
api:
  base_url: https://api-inference.huggingface.co/models
  env_key: HF_API_KEY
  timeout: 120
  max_retries: 3

# Generation parameters
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# Chat template
chat_template: mistral
