# Groq API Configuration
name: groq_llama3
family: llama

# Model source
source: api
api_provider: groq
model_id: llama-3.3-70b-versatile

# API settings
api:
  base_url: https://api.groq.com/openai/v1
  env_key: GROQ_API_KEY
  timeout: 60
  max_retries: 3

# Generation parameters
generation:
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9

# Chat template (handled by API)
chat_template: null
