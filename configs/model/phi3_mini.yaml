# Phi-3 Mini Configuration
name: phi3_mini
family: phi

# Model source
source: local
model_id: microsoft/Phi-3-mini-4k-instruct
revision: main

# Quantization settings
quantization:
  enabled: false
  bits: 4
  quant_type: nf4

# Generation parameters
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.1

# Chat template
chat_template: phi3

# Memory optimization
use_flash_attention: true
gradient_checkpointing: true
