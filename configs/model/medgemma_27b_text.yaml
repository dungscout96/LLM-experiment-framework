# MedGemma 27B Text-Only Configuration
# Medical domain-specialized model for text generation
name: medgemma_27b_text
family: gemma

# Model source
source: local
model_id: google/medgemma-27b-text-it
revision: main

# This model requires HuggingFace authentication (gated model)
# Set HF_TOKEN environment variable or configure hf_token below
hf_token: ${oc.env:HF_TOKEN,null}

# Quantization settings (recommended for 27B model)
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true

# Generation parameters
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.1

# Chat template
chat_template: null  # Uses model's built-in template

# Memory optimization
use_flash_attention: true
gradient_checkpointing: true
