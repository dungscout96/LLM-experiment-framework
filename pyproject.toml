[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LLM-experiment-framework"
version = "0.1.0"
description = "A framework for experimenting with LLM fine-tuning and agentic workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",

    # PEFT and Training
    "peft>=0.7.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.41.0;platform_system!='Darwin'",

    # Configuration and Tracking
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "mlflow>=2.9.0",

    # Agentic Frameworks
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langgraph>=0.0.20",

    # API Clients
    "openai>=1.6.0",
    "groq>=0.4.0",
    "huggingface-hub>=0.20.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Vector Store for RAG
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]
mlx = [
    "mlx>=0.1.0",
    "mlx-lm>=0.1.0",
]
llama-cpp = [
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
llm-train = "scripts.train:main"
llm-eval = "scripts.evaluate:main"
llm-agent = "scripts.run_agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "configs*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
